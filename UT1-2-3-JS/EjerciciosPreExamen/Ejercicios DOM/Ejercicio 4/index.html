<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 DOM</title>
    <script src="main.js" defer></script>
    <style>

        p[id] {
            color:red
        }
    </style>
</head>
<body>

    <label for="deporteFav">¿Deporte favorito?</label>
    <input type="text" id="inputDeporte">
    <br>
    <label for="serieFav">¿Serie favorita?</label>
    <input type="text" id="inputSerie">
    <br>
    <label for="peliculaFav">¿Pelicula favorita?</label>
    <input type="text" id="inputPelicula">
    <br>
    <br>
    <button id="boton">Aceptar aficiones</button>

    <div class="listaAficiones">MIS AFICIONES .....</div>
    <p id="idDeporte">¿Mi deporte favorito?</p>
    <br>
    <p id="idSerie">¿Mi serie favorita?</p>
    <br>
    <p id="idPelicula">¿Mi pelicula favorita?</p>
</body>
</html>
