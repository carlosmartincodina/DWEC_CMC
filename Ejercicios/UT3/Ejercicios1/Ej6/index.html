<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Lista de la Compra</title>
    <script src="main.js" defer></script>
    <style>
        fieldset {
            padding: 1.5rem;
            font-family: Arial, Helvetica, sans-serif;
            margin-right: 41rem;
            border-radius: 30px;
            border-color: blanchedalmond;
        }
        #boton {
            border-radius: 10px;
        }
    </style>
</head>
<body>

<form>
  <fieldset>
    <!-- CORRECCIÓN: 'legend' es la etiqueta correcta para el título de un fieldset -->
    <legend>Lista de la compra</legend>
    
    <ul id="listaCompra">
        <!-- MEJORA: Evitar IDs numéricos puros para prevenir fallos en JS/CSS -->
        <li id="item-1">Patatas</li>
        <li id="item-2">Kiwi</li>
        <li id="item-3">Plátano</li>
    </ul>
    
    <label for="campoTexto">Añadir item:</label>
    <div>
        <!-- MEJORA: El 'for' del label debe coincidir con el 'id' del input -->
        <input type="text" id="campoTexto">
        <!-- CORRECCIÓN: type="button" evita que el botón recargue la página al hacer clic -->
        <button type="button" id="boton">Añadir</button>
    </div>
  </fieldset>
</form>
    
</body>
</html>
