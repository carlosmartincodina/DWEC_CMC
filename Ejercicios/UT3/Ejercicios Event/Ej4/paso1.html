
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de archivos - Paso 1</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script>
</head>
<body>

    <main class="gestor">

        <h1>Gestor de Archivos</h1>

        <p class="instrucciones">
            Arrastra el papel arrugado a la papelera.<br>
            <strong>Haz doble clic en la papelera para vaciarla.</strong>
        </p>

        <section class="zona-archivos">

            <img src="recycle-bin.png"
                 alt="Papelera vacía"
                 class="papelera">

            <img src="paper.png"
                 alt="Papel arrugado"
                 class="papel">

        </section>

    </main>

</body>
</html>
