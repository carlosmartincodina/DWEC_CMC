<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrastrar y Soltar - Papelera</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="papelera.js" defer></script>
</head>
<body>

    <main class="escritorio">
        <header class="cabecera">
            <h1>Gestor de Archivos</h1>
            <p>Arrastra el papel arrugado a la papelera. <br><em>Haz doble clic en la papelera para vaciarla.</em></p>
        </header>

        <div class="zona-trabajo">
            <!-- Contenedor de la papelera -->
            <div id="div1" class="contenedor-papelera">
                <img id="papelera" src="papeleraVacia.jpg" alt="Papelera" class="papelera-img">
            </div>

            <!-- El elemento arrastrable -->
            <img id="bola" src="bola.jpg" alt="Papel arrugado" draggable="true" class="papel-img">
        </div>
    </main>

</body>
</html>
