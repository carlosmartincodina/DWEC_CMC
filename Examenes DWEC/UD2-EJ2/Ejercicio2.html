<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Progresivo</title>
    <link rel="stylesheet" href="ejercicio2.css">
    <script src="Ejercicio2.js" defer></script>
</head>
<body>

    <div class="contenedor">
        <h1>Contador Progresivo</h1>
        
        <div class="formulario">
            <label for="valorInicial">Valor Inicial:</label>
            <input type="number" id="valorInicial" placeholder="Ej: 1">
            
            <label for="valorFinal">Valor Final:</label>
            <input type="number" id="valorFinal" placeholder="Ej: 10">
            
            <button id="btnIniciar">Iniciar Contador</button>
        </div>

        <p id="estado">Introduce los valores y pulsa "Iniciar".</p>
    </div>

    
</body>
</html>
